services:
  - type: web
    name: panaderia-merino-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: MerinoBackend2026_Seguro_2026
      - key: JWT_EXPIRE
        value: 24h
