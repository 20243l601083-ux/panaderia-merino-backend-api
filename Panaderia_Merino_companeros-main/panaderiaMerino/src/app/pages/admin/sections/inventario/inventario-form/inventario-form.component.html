<ion-header translucent>
  <ion-toolbar color="light">
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Cerrar</ion-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Editar' : 'Agregar' }} producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="form-container">
    <ion-item>
      <ion-label position="floating">Nombre del producto</ion-label>
      <ion-input [(ngModel)]="formData.name" placeholder="Ej: Pan de masa madre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Cantidad</ion-label>
      <ion-input type="number" [(ngModel)]="formData.quantity" placeholder="0"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Fecha de almacenamiento</ion-label>
      <ion-input type="date" [(ngModel)]="formData.stored"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Precio</ion-label>
      <ion-input type="number" [(ngModel)]="formData.price" placeholder="0.00" step="0.01"></ion-input>
    </ion-item>

    <div class="form-actions">
      <ion-button expand="block" (click)="save()" class="save-btn">
        {{ isEdit ? 'Actualizar' : 'Guardar' }}
      </ion-button>
      <ion-button expand="block" fill="outline" (click)="cancel()">
        Cancelar
      </ion-button>
    </div>
  </div>
</ion-content>
